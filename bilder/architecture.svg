ba(244,241,236,0.9)" text-anchor="middle">Research</text><text x="984.0" y="624" font-size="15.5" font-weight="600" fill="rgba(244,241,236,0.62)" text-anchor="middle">reads sources</text><text x="600" y="690" font-size="15.5" font-weight="800" fill="rgba(244,241,236,0.56)" text-anchor="middle" letter-spacing="3.10">AGENT ROLES · FRESH SESSION PER TASK · OWN GIT WORKTREE</text><text x="600" y="728" font-size="17" font-weight="600" fill="rgba(244,241,236,0.62)" text-anchor="middle">run in the background, several in parallel</text><text x="1120" y="268" font-size="15.5" font-weight="800" fill="rgba(244,241,236,0.56)" text-anchor="start" letter-spacing="3.10">INSIDE THE APP</text><rect x="1120" y="282" width="380" height="112" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><path d="M1138,283.5 H1482" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="1146" y="320" font-size="21" font-weight="800" fill="rgba(244,241,236,0.9)" text-anchor="start">Permission pop-ups</text><text x="1146" y="350" font-size="16" font-weight="600" fill="rgba(244,241,236,0.66)" text-anchor="start">start a role, push, delete:</text><text x="1146" y="374" font-size="16" font-weight="600" fill="rgba(244,241,236,0.66)" text-anchor="start">I click Allow</text><rect x="1120" y="408" width="380" height="112" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><path d="M1138,409.5 H1482" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="1146" y="446" font-size="21" font-weight="800" fill="rgba(244,241,236,0.9)" text-anchor="start">Own MCP server</text><text x="1146" y="476" font-size="16" font-weight="600" fill="rgba(244,241,236,0.66)" text-anchor="start">tools the agents call:</text><text x="1146" y="500" font-size="16" font-weight="600" fill="rgba(244,241,236,0.66)" text-anchor="start">rolle_starten · funk_senden · …</text><rect x="1120" y="534" width="380" height="112" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><path d="M1138,535.5 H1482" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="1146" y="572" font-size="21" font-weight="800" fill="rgba(244,241,236,0.9)" text-anchor="start">Hooks</text><text x="1146" y="602" font-size="16" font-weight="600" fill="rgba(244,241,236,0.66)" text-anchor="start">PreToolUse checks every tool call,</text><text x="1146" y="626" font-size="16" font-weight="600" fill="rgba(244,241,236,0.66)" text-anchor="start">Stop holds a master back</text><rect x="1120" y="660" width="380" height="112" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><path d="M1138,661.5 H1482" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="1146" y="698" font-size="21" font-weight="800" fill="rgba(244,241,236,0.9)" text-anchor="start">Dashboard</text><text x="1146" y="728" font-size="16" font-weight="600" fill="rgba(244,241,236,0.66)" text-anchor="start">I switch tools off and</text><text x="1146" y="752" font-size="16" font-weight="600" fill="rgba(244,241,236,0.66)" text-anchor="start">block addresses</text><path d="M860,96 H1400 V262" fill="none" stroke="rgba(244,241,236,0.55)" stroke-width="2" stroke-dasharray="7 7"/><line x1="1400" y1="262" x2="1400.0" y2="267.0" stroke="rgba(244,241,236,0.55)" stroke-width="2"/><path d="M1400,280 L1407.0,267.0 L1393.0,267.0 Z" fill="rgba(244,241,236,0.55)"/><text x="1386" y="84" font-size="17" font-weight="600" fill="rgba(244,241,236,0.62)" text-anchor="end">answer permission prompts</text><line x1="600" y1="810" x2="600.0" y2="855.0" stroke="rgba(244,241,236,0.55)" stroke-width="2"/><path d="M600,868 L607.0,855.0 L593.0,855.0 Z" fill="rgba(244,241,236,0.55)"/><text x="614" y="846" font-size="17" font-weight="600" fill="rgba(244,241,236,0.62)" text-anchor="start">starts</text><rect x="60" y="870" width="1480" height="92" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><path d="