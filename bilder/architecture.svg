<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Team-OS architecture</title><defs><radialGradient id="sonne" cx="0.02" cy="-0.06" r="0.62"><stop offset="0" stop-color="#FF9A1F" stop-opacity="0.13"/><stop offset="1" stop-color="#FF9A1F" stop-opacity="0"/></radialGradient><radialGradient id="mond" cx="1" cy="1.06" r="0.6"><stop offset="0" stop-color="#9A6BFF" stop-opacity="0.12"/><stop offset="1" stop-color="#9A6BFF" stop-opacity="0"/></radialGradient><linearGradient id="verlauf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9A1F"/><stop offset="1" stop-color="#9A6BFF"/></linearGradient></defs><rect width="1600" height="1000" fill="#0B0A0E"/><rect width="1600" height="1000" fill="url(#sonne)"/><rect width="1600" height="1000" fill="url(#mond)"/><rect x="340" y="44" width="520" height="104" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><path d="M358,45.5 H842" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="600" y="82" font-size="15.5" font-weight="800" fill="rgba(244,241,236,0.56)" text-anchor="middle" letter-spacing="3.10">ME · AI AGENT BUILDER</text><text x="600" y="120" font-size="21" font-weight="700" fill="rgba(244,241,236,0.88)" text-anchor="middle">design the system · decide · sign off</text><rect x="60" y="206" width="1480" height="604" rx="28" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/><text x="96" y="246" font-size="15.5" font-weight="800" fill="rgba(244,241,236,0.62)" text-anchor="start" letter-spacing="3.10">TEAM-OS APP (RUST) · ORCHESTRATOR</text><line x1="600" y1="148" x2="600.0" y2="267.0" stroke="rgba(244,241,236,0.55)" stroke-width="2"/><path d="M600,280 L607.0,267.0 L593.0,267.0 Z" fill="rgba(244,241,236,0.55)"/><text x="614" y="186" font-size="17" font-weight="600" fill="rgba(244,241,236,0.62)" text-anchor="start">plan with the master</text><rect x="340" y="282" width="520" height="112" rx="18" fill="rgba(255,255,255,0.05)" stroke="url(#verlauf)" stroke-width="2.5"/><path d="M358,283.5 H842" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><text x="600" y="320" font-size="15.5" font-weight="800" fill="rgba(255,154,31,0.95)" text-anchor="middle" letter-spacing="3.10">MASTER AGENT · ONE PER PROJECT</text><text x="600" y="360" font-size="21" font-weight="700" fill="rgba(244,241,236,0.88)" text-anchor="middle">plans · writes handoffs · reviews · ships</text><line x1="540" y1="394" x2="540.0" y2="507.0" stroke="rgba(244,241,236,0.55)" stroke-width="2"/><path d="M540,520 L547.0,507.0 L533.0,507.0 Z" fill="rgba(244,241,236,0.55)"/><line x1="660" y1="520" x2="660.0" y2="407.0" stroke="rgba(244,241,236,0.55)" stroke-width="2"/><path d="M660,394 L653.0,407.0 L667.0,407.0 Z" fill="rgba(244,241,236,0.55)"/><text x="526" y="463" font-size="17" font-weight="600" fill="rgba(244,241,236,0.62)" text-anchor="end">handoff (task brief)</text><text x="674" y="463" font-size="17" font-weight="600" fill="rgba(244,241,236,0.62)" text-anchor="start">completion report</text><rect x="128.0" y="522" width="176" height="120" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><path d="M146.0,523.5 H286.0" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><path d="M216.0,543 Q218.86,553.14 229.0,556 Q218.86,558.86 216.0,569 Q213.14,558.86 203.0,556 Q213.14,553.14 216.0,543 Z" fill="#F4843D"/><text x="216.0" y="598" font-size="20" font-weight="800" fill="rgba(244,241,236,0.9)" text-anchor="middle">Build</text><text x="216.0" y="624" font-size="15.5" font-weight="600" fill="rgba(244,241,236,0.62)" text-anchor="middle">writes code</text><rect x="320.0" y="522" width="176" height="120" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/><path d="M338.0,523.5 H478.0" stroke="rgba(255,255,255,0.16)" stroke-width="1"/><path d="M408.0,543 Q410.86,553.14 4